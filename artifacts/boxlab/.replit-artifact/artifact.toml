kind = "web"
previewPath = "/"
title = "BOXLAB — Landing Page"
version = "1.0.0"
id = "artifacts/boxlab"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23071

[services.development]
run = "pnpm --filter @workspace/boxlab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/boxlab", "run", "build" ]
serve = "static"
publicDir = "artifacts/boxlab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23071"
BASE_PATH = "/"
